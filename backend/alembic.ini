# Alembic Configuration File
# This file is typically auto-generated by `alembic init`. It contains environment-specific
# settings for database migration management.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
# the output encoding used when revision files
# are written from script.py.mako
# string value is passed to encoding.encode()
file_encoding = utf-8

# When set to 'true', revision file will be executed with <# encoding: utf-8 #>
# This value can be true (in uppercase) or false (in lowercase)
# sqlalchemy.echo = true

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
